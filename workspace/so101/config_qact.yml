# Training Configuration for Wall-X Robotic Multi-Modal Learning
# This configuration supports multi-modal learning with vision, language, and action data

# Model and paths configuration
log_name: "so101_pap151_20260321"
log_project: "vla_training"
model_type: wall-oss
pretrained_wallx_path: "/home/pengguanqi/Models/wall-oss-flow/"  # Must set
save_path: "/home/pengguanqi/Workspace/VLA/wall-x/workspace/so101_pap151_20260321/workspace/"                # Must set
use_fast_tokenizer: False                       # True: train FAST, False: train Flow
action_tokenizer_path: "/home/pengguanqi/Models/fast/"         # Must set if use_fast_tokenizer is true
use_flash_attn: False

# Torch Profile
profile: False
profile_save_path: /home/pengguanqi/Workspace/VLA/wall-x/workspace/so101_pap151_20260321/profile/
profile_wait_iters: 10
profile_warmup_iters: 5
profile_active_iters: 2

# Training hyperparameters
num_warmup_steps: 100
num_training_steps: 64000000
learning_rate: 0.00005
min_lr: 0.00005
num_epoch: 100
gradient_accumulation_steps: 64
batch_size_per_gpu: 4
padding_side: left
epoch_save_interval: 2

# Training optimization settings
FSDP2: False
torch_compile: False

# # Checkpoint resuming configuration
# resume:
#   ckpt: "/home/pengguanqi/Workspace/VLA/wall-x/workspace/lerobot_libero/workspace/test3/11/"
#   load_ckpt_only: true

# Robot configuration - Define degrees of freedom for each component
dof_config:
  shoulder_pan.pos: 1
  shoulder_lift.pos: 1
  elbow_flex.pos: 1
  wrist_flex.pos: 1
  wrist_roll.pos: 1
  gripper.pos: 1

# Agent proprioception configuration (typically matches DOF config)
agent_pos_config:
  shoulder_pan.pos: 1
  shoulder_lift.pos: 1
  elbow_flex.pos: 1
  wrist_flex.pos: 1
  wrist_roll.pos: 1
  gripper.pos: 1

norm_stats_path: "/home/pengguanqi/Workspace/VLA/test/wall-x/workspace/so101_pap151_20260321/lerobot/so101/norm_stats.json"

enable_customized_robot_config: true
customized_robot_config:
  name: "lerobot/so101"
  customized_dof_config:
    shoulder_pan.pos: 1
    shoulder_lift.pos: 1
    elbow_flex.pos: 1
    wrist_flex.pos: 1
    wrist_roll.pos: 1
    gripper.pos: 1
  customized_agent_pos_config:
    shoulder_pan.pos: 1
    shoulder_lift.pos: 1
    elbow_flex.pos: 1
    wrist_flex.pos: 1
    wrist_roll.pos: 1
    gripper.pos: 1

# Data configuration
data:
  use_lerobot: true

  # LeRobot dataset configuration
  lerobot_config:
    repo_id: "lerobot/so101"
    root: "/home/pengguanqi/Datasets/so101_pap151_20260321_offset"
    episodes: null
    image_transforms: null
    delta_timestamps: null
    tolerance_s: 0.04
    revision: null
    force_cache_sync: false
    download_videos: true
    video_backend: null

  action_horizon: 32
  train_test_split: 0.95

  # Action keys for observation and prediction
  obs_action_keys:
    - shoulder_pan.pos
    - shoulder_lift.pos
    - elbow_flex.pos
    - wrist_flex.pos
    - wrist_roll.pos
    - gripper.pos

  predict_action_keys:
    - shoulder_pan.pos
    - shoulder_lift.pos
    - elbow_flex.pos
    - wrist_flex.pos
    - wrist_roll.pos
    - gripper.pos

  # Image resolution configuration for different camera views
  resolution:
    face_view: 256
    left_wrist_view: 256
    right_wrist_view: 256
    move1_view: 256
    move2_view: 256
    top_view: 256
    wall_view: 256
    multi_modal: 256
    up: 256
    wrist: 256
